<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Зал</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --fb-bg:#f1f1f5;--fb-card:#fff;--fb-text:#141416;--fb-hint:#8b8b93;--fb-accent:#2f7cf6;--fb-sep:rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){:root{--fb-bg:#0f0f11;--fb-card:#1c1c20;--fb-text:#f2f2f4;--fb-hint:#8d8d96;--fb-accent:#4a8fff;--fb-sep:rgba(255,255,255,.08)}}
:root{
  --bg:var(--tg-theme-secondary-bg-color,var(--fb-bg));
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,var(--fb-card)));
  --text:var(--tg-theme-text-color,var(--fb-text));
  --hint-raw:var(--tg-theme-hint-color,var(--fb-hint));
  --accent:var(--tg-theme-button-color,var(--fb-accent));
  --accent-text:var(--tg-theme-button-text-color,#fff);
  --link:var(--tg-theme-accent-text-color,var(--tg-theme-link-color,var(--fb-accent)));
  --sep:var(--tg-theme-section-separator-color,var(--fb-sep));
  --danger:var(--tg-theme-destructive-text-color,#e5484d);
  --good:#2fb36b;--warn:#e8930c;
  --safe-b:max(env(safe-area-inset-bottom),calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)));
  --safe-t:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  --vh:var(--tg-viewport-stable-height,100vh);
  --r-card:16px;--r-ctl:12px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;
  --fs-xs:12px;--fs-s:13px;--fs-m:15px;--fs-l:17px;
}
:root{
  /* подсказки темнее/светлее исходного цвета темы: контраст не ниже 4,5:1 */
  --hint:color-mix(in srgb,var(--hint-raw) 66%,var(--text));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
#view{padding:calc(12px + var(--safe-t)) 14px calc(84px + var(--safe-b));max-width:560px;margin:0 auto}
h1{font-size:26px;line-height:1.15;margin:4px 0 2px;font-weight:700;letter-spacing:-.3px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--hint);margin:22px 4px 8px}
.sub{color:var(--hint);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--link)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.muted{background:color-mix(in srgb,var(--hint) 16%,transparent);color:var(--hint)}
.note{font-size:13px;color:var(--hint);padding:10px 14px;border-radius:14px;border:1px dashed var(--sep);margin:8px 0}
.ex{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left}
.num{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--link)}
.num.done{background:var(--good);color:#fff}
.ex-name{font-weight:600;font-size:16px}
.ex-meta{font-size:13px;color:var(--hint);margin-top:2px}
.ex-last{font-size:13px;margin-top:6px}
.chev{color:var(--hint);font-size:20px;line-height:30px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:16px;text-align:center}
.btn.sec{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--link)}
.btn.ghost{background:transparent;color:var(--danger);font-weight:500}
.btn:active{opacity:.75}
.seg{display:flex;background:color-mix(in srgb,var(--hint) 14%,transparent);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--card);color:var(--hint)}
.chip.on{background:var(--accent);color:var(--accent-text)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:22px;letter-spacing:-.3px}
.stat span{font-size:12px;color:var(--hint)}
.chart{position:relative;height:210px}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--sep);font-size:14px}
.list-item:first-child{border-top:0}
.navarrow{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:20px;display:grid;place-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 0;border-top:1px solid var(--sep);vertical-align:top}
tr:first-child td{border-top:0}
td:last-child{text-align:right;font-weight:600}
details{background:var(--card);border-radius:14px;margin-bottom:8px;padding:0 14px}
summary{padding:13px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--hint)}
details[open] summary::after{content:"－"}
details p{margin:0 0 14px;font-size:14px;color:var(--text);white-space:pre-line}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);color:var(--text);padding:10px;font:12px ui-monospace,monospace}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--sep);display:flex;padding:6px 6px calc(6px + var(--safe-b));z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--hint);padding:4px 0}
nav button.on{color:var(--link)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* sheet */
#sheet{position:fixed;inset:0;z-index:10;display:none}
#sheet.open{display:block}
#sheet .shade{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fade .2s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:min(88vh,calc(var(--vh) - 24px - var(--safe-t)));overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px 16px calc(16px + var(--safe-b));animation:up .22s ease-out;max-width:560px;margin:0 auto}
.grab{width:38px;height:5px;border-radius:9px;background:var(--sep);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@keyframes fade{from{opacity:0}}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--link);font-size:22px;font-weight:600;flex:none}
.stepper input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);text-align:center;font-size:20px;font-weight:700}
.set-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.set-row label{flex:none;white-space:nowrap;font-size:13px;color:var(--hint)}
.set-row .stepper{flex:1;min-width:0}
.set-row .stepper button{width:40px;height:40px}
.set-row .stepper input{height:40px;font-size:18px}
.small-actions{display:flex;gap:8px;margin:6px 0 14px}
.small-actions button{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--hint) 12%,transparent)}
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(20,20,22,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;max-width:90vw;transition:.25s;pointer-events:none;z-index:20;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:60px 0;text-align:center;color:var(--hint)}
.ring-card{display:flex;align-items:center;gap:16px}
.ring-wrap{position:relative;width:64px;height:64px;flex:none}
.ring-wrap svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring-wrap circle{fill:none;stroke-width:7}
.ring-wrap .track{stroke:color-mix(in srgb,var(--accent) 14%,transparent)}
.ring-wrap .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-wrap b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.wdots{display:flex;gap:12px;margin-top:8px}
.wdot{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--hint)}
.wdot i{width:16px;height:16px;border-radius:50%;background:color-mix(in srgb,var(--hint) 20%,transparent)}
.wdot i.done{background:var(--good)}
.wdot i.today{background:transparent;box-shadow:inset 0 0 0 2.5px var(--accent)}
.wdot i.miss{background:color-mix(in srgb,var(--danger) 35%,transparent)}
.cal{display:grid;grid-template-columns:20px repeat(12,1fr);gap:4px;margin-top:12px}
.cal span{font-size:10px;color:var(--hint);line-height:1;align-self:center}
.cal i{aspect-ratio:1;border-radius:5px;background:color-mix(in srgb,var(--hint) 11%,transparent)}
.cal i.plan{background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 50%,transparent)}
.cal i.done{background:var(--accent)}
.cal i.miss{background:color-mix(in srgb,var(--danger) 32%,transparent)}
.cal i.today{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--hint);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.scheme{width:100%;height:auto;display:block;margin:2px 0 4px}
.scheme .k{fill:none;stroke:var(--hint);stroke-width:2.2;stroke-linecap:round;opacity:.75}
.scheme .b{fill:none;stroke:var(--text);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.scheme .h{fill:none;stroke:var(--text);stroke-width:2.6}
.scheme .pl{fill:color-mix(in srgb,var(--accent) 24%,transparent);stroke:var(--accent);stroke-width:1.6}
.scheme .g{fill:none;stroke:var(--hint);stroke-width:1.3;stroke-dasharray:4 4}
.scheme .mv{fill:none;stroke:var(--warn);stroke-width:2.2}
.scheme .st{fill:none;stroke:var(--hint);stroke-width:1.4}
.scheme .lb{font-size:15px;fill:var(--hint);text-anchor:middle}
.scheme .lb.good{fill:var(--good)} .scheme .lb.bad{fill:var(--danger)}
.scheme .cn circle{fill:var(--accent)}
.scheme .cn text{fill:var(--accent-text);font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.cues{margin:0 0 12px;padding:0;list-style:none;font-size:14px}
.cues li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.cues b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-text);font-size:12px;display:grid;place-items:center}
.colors{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.colors button{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--card);position:relative}
.colors button.on{outline:3px solid var(--text);outline-offset:1px}
.colors .tgc{background:conic-gradient(#2f7cf6 0 50%,#33b5e5 0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:45%;left:50%;width:8px;height:12px;border-radius:2px;animation:boom 1.4s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes boom{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.pr{color:var(--warn)}
.meal{padding:12px 0;border-top:1px solid var(--sep)}
.meal:first-child{border-top:0;padding-top:2px}
.meal-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.meal-h b{font-size:15px}
.meal-k{flex:none;font-size:12px;color:var(--hint);white-space:nowrap}
.meal-k span{color:var(--link);font-weight:700}
.meal p{margin:3px 0 0;font-size:13px;color:var(--hint)}
.plan-row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--sep);font-size:14px;align-items:center}
.plan-row:first-child{border-top:0}
.plan-row .tm{color:var(--hint);font-size:13px;font-variant-numeric:tabular-nums}
.plan-row .kc{font-weight:600;font-size:13px;text-align:right}
.fsum{display:flex;gap:16px;align-items:center}
.kring{position:relative;width:104px;height:104px;flex:none}
.kring svg{width:104px;height:104px;transform:rotate(-90deg)}
.kring circle{fill:none;stroke-width:9}
.kring .track{stroke:color-mix(in srgb,var(--accent) 13%,transparent)}
.kring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.kring .val.over{stroke:var(--warn)}
.kring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kring b{font-size:22px;letter-spacing:-.4px;line-height:1.1}
.kring span{font-size:11px;color:var(--hint)}
.kleft{font-size:14px;margin-bottom:6px}.kleft.over b{color:var(--warn)}
.mb{font-size:12px;margin-top:6px}
.mb-track{height:6px;border-radius:9px;background:color-mix(in srgb,var(--hint) 15%,transparent);margin-top:3px;overflow:hidden}
.mb-track i{display:block;height:100%;border-radius:9px;transition:width .5s}
.mb-track i.p{background:var(--accent)}.mb-track i.f{background:var(--warn)}.mb-track i.c{background:var(--good)}
.fsearch{display:flex;gap:8px;margin:12px 0 8px}
.fsearch input{flex:1;min-width:0;height:46px;border-radius:14px;border:1px solid var(--sep);background:var(--card);padding:0 14px;font-size:16px;color:var(--text)}
.icbtn{flex:none;width:46px;height:46px;border-radius:14px;background:var(--card);display:grid;place-items:center;color:var(--link);font-size:20px}
.icbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.qchips{padding-top:0}
.fres{padding:6px 14px}
.fitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--sep)}
.fitem:first-child{border-top:0}
.fitem .fn{display:block;font-size:15px;font-weight:500}
.fitem .fq{display:block;font-size:12px;color:var(--hint);margin-top:1px}
.fitem>b{flex:none;font-size:15px}
.mealcard .fitem:first-of-type{border-top:0}
.mealcard>.row{margin-bottom:2px}
.mealcard.empty{padding:11px 16px;margin-bottom:6px}.mealcard.empty b{font-weight:500;color:var(--hint)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:6px;vertical-align:1px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--link)}
.tag.off{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.offh{font-size:12px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.4px;padding:10px 0 2px;border-top:1px solid var(--sep);margin-top:4px}
.linkbtn{display:block;width:100%;text-align:left;padding:11px 0 9px;border-top:1px solid var(--sep);color:var(--link);font-weight:600;font-size:14px}
.ftot{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:12px 0 10px;font-size:14px;color:var(--hint)}
.ftot b{font-size:20px;color:var(--text);margin-right:4px}
.ideas{margin-top:18px}
.ideas .meal p{flex:1}
.addidea{flex:none;width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--link);font-size:18px;font-weight:600;margin-left:8px}
.tinp{width:100%;height:44px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);padding:0 12px;font-size:16px;color:var(--text)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.g4 label,.g1{display:block;font-size:12px;color:var(--hint)}
.g4 .tinp{padding:0 6px;text-align:center}
.g1{margin-top:10px}.g1 span,.g4 span{display:block;margin-bottom:4px}
.scanbox{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox i{position:absolute;left:12%;right:12%;top:42%;height:16%;border:2px solid rgba(255,255,255,.85);border-radius:10px}
.scanbox div{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff !important;font-size:13px}
.scanbox.off{aspect-ratio:auto;height:90px;background:color-mix(in srgb,var(--hint) 15%,transparent)}
.scanbox.off i{display:none}.scanbox.off div{color:var(--hint) !important;top:34px}
.myrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--sep);font-size:14px}
.myrow:first-child{border-top:0}
.myrow button{color:var(--danger);font-size:18px;padding:0 6px}
.kb4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kb4 label{font-size:12px;color:var(--hint)}.kb4 .tinp{text-align:center;padding:0 4px}
#view.anim>*{animation:fadeUp .28s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:no-preference){
  .ring-wrap .val,.kring .val,.mring .val{animation:ringIn .9s cubic-bezier(.2,.7,.3,1) both}
}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.streak{font-size:13px}
.banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:color-mix(in srgb,var(--warn) 13%,var(--card));border-radius:16px;padding:12px 14px;margin:6px 0 10px}
.banner b{display:block;font-size:15px}.banner .sub{font-size:12.5px}.banner>span:first-child{font-size:22px}
.quick{padding:4px 16px}
.qrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--sep);cursor:pointer}
.qrow:first-child{border-top:0;cursor:default}
.qrow b{font-size:20px;letter-spacing:-.3px}
.qic{width:44px;text-align:center;font-size:24px;flex:none}
.qsub{display:block;font-size:12px;margin-top:1px}
.qbtn{flex:none;padding:9px 13px;border-radius:12px;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:14px}
.qbtn.ghost{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--link)}
.mini-step{display:flex;align-items:center;gap:4px}
.mini-step button{width:30px;height:34px;border-radius:9px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--link);font-size:18px;font-weight:600}
.mini-step input{width:62px;height:34px;border-radius:9px;border:1px solid var(--sep);background:var(--bg);text-align:center;font-weight:700;font-size:16px}
.mring{position:relative;width:44px;height:44px;flex:none}
.mring svg{width:44px;height:44px;transform:rotate(-90deg)}
.mring circle{fill:none;stroke-width:6}
.mring .track{stroke:color-mix(in srgb,var(--accent) 14%,transparent)}
.mring .val{stroke:var(--accent);stroke-linecap:round}.mring .val.over{stroke:var(--warn)}
.sumcard .smrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.sm{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 2px;border-radius:12px;background:color-mix(in srgb,var(--hint) 9%,transparent)}
.sm b{font-size:17px;letter-spacing:-.3px}.sm b.good{color:var(--good)}.sm b.warn{color:var(--warn)}
.sm span{font-size:11px;color:var(--hint);line-height:1.2;margin-top:2px}

/* Калькулятор блинов и разминки */
const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25], BAR = 20;
function platesFor(wt){
  let side = (wt - BAR) / 2; if (side < 0) return null;
  const out = [];
  for (const p of PLATES){ while (side >= p - 1e-9){ out.push(p); side -= p; } }
  return {plates: out, rest: Math.round(side * 100) / 100};
}
function warmupFor(k, wt){
  const e = EX[k]; if (e.kind !== "w" || !(wt > 0)) return [];
  const rnd = x => { const s = e.bar ? 2.5 : (e.step || 1); return Math.max(e.bar ? BAR : s, Math.round(x / s) * s); };
  let sets = e.bar ? [[BAR, 10], [rnd(wt * .5), 8], [rnd(wt * .7), 4], [rnd(wt * .85), 2]] : [[rnd(wt * .5), 10], [rnd(wt * .75), 5]];
  if (e.bar && wt <= 35) sets = [[BAR, 10], [rnd(wt * .75), 5]];
  const seen = new Set();
  return sets.filter(([w]) => w < wt && !seen.has(w) && seen.add(w));
}
function calcHtml(k, wt){
  const e = EX[k]; if (e.kind !== "w" || !(wt > 0)) return "";
  let h = "";
  if (e.bar){
    const pf = platesFor(wt);
    h += pf ? `<div class="calc-row"><span>На сторону</span><b>${pf.plates.length ? pf.plates.map(p => `<i class="plate p${String(p).replace(".", "_")}">${fmt(p)}</i>`).join("") : "только гриф"}${pf.rest ? ` <small class="sub">+${fmt(pf.rest)} не набрать</small>` : ""}</b></div>` : "";
  }
  const wu = warmupFor(k, wt);
  if (wu.length) h += `<div class="calc-row"><span>Разминка</span><b class="wu">${wu.map(([w, r]) => `${fmt(w)}×${r}`).join(" · ")}</b></div>`;
  return h ? `<div class="calc">${h}</div>` : "";
}

function scheme(k){
  const s = SCH[k]; if (!s) return "";
  const pose = p => `<path d="${p.kit}" class="k"/>${p.guide ? `<path d="${p.guide}" class="g"/>` : ""}<circle cx="${p.head[0]}" cy="${p.head[1]}" r="11" class="h"/>${p.body.map(d => `<path d="${d}" class="b"/>`).join("")}${p.pl ? `<circle cx="${p.pl[0]}" cy="${p.pl[1]}" r="14" class="pl"/>` : ""}${p.db ? `<rect x="${p.db[0]-12}" y="${p.db[1]-4}" width="24" height="8" rx="3" class="pl"/>` : ""}`;
  const lc = s.lbc || ["",""];
  return `<svg class="scheme" viewBox="70 18 480 232" role="img" aria-label="${EX[k].name}: схема выполнения">
    <defs><marker id="st-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--hint)"/></marker>
    <marker id="mv-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--warn)"/></marker></defs>
    ${pose(s.a)}${pose(s.b)}
    ${s.nostep ? "" : `<path d="${s.step || "M270 140 H340"}" class="st" marker-end="url(#st-${k})"/>`}
    ${s.mv ? `<path d="${s.mv}" class="mv" marker-end="url(#mv-${k})"/>` : ""}
    <text x="170" y="240" class="lb ${lc[0]}">${s.lb[0]}</text><text x="440" y="240" class="lb ${lc[1]}">${s.lb[1]}</text>
    ${s.c.map((c, i) => `<g class="cn"><circle cx="${c[0]}" cy="${c[1]}" r="10"/><text x="${c[0]}" y="${c[1]}">${i+1}</text></g>`).join("")}
  </svg><ul class="cues">${s.c.map((c, i) => `<li><b>${i+1}</b><span>${c[2]}</span></li>`).join("")}</ul>`;
}

/* days: {"2026-09-28": {w:"A", done:true, ex:{bench:{wt:62.5, r:[8,8,8]}}}}

const S = { ck:{}, pseg:"train", food:{}, my:[], sets:[], freq:{}, fdate:today(), fq:"", fmeal:null, fres:[], offRes:null, offQ:"", meal:"breakfast", cfg:{theme:"violet"}, days:{}, body:{}, view:"today", cur:today(), override:null, prog:"bench", moreTab:"prog", sheet:null };
/* Хранение пачками: тренировки — по месяцам (wm_YYYYMM), еда — по неделям (fw_YYYYMMDD, понедельник),
   тело — по месяцам (b_YYYYMM). Длинное значение делится на части base, base_1, base_2… (лимит 4096 символов). */
const CHUNK = 3800;
const wmKey = ds => "wm_" + ds.slice(0, 7).replace("-", "");
const fwKey = ds => "fw_" + iso(mondayOf(fromIso(ds))).replace(/-/g, "");

async function putChunked(base, txt){
  const parts = [];
  for (let i = 0; i < txt.length; i += CHUNK) parts.push(txt.slice(i, i + CHUNK));
  const prev = S.ck[base] || 0;
  for (let i = 0; i < parts.length; i++) await Store.set(i ? `${base}_${i}` : base, parts[i]);
  for (let i = parts.length; i < prev; i++) await Store.del(i ? `${base}_${i}` : base);
  S.ck[base] = parts.length;
}
async function loadAll(){
  const all = await Store.keys();
  const vals = await Store.getMany(all.filter(k => /^(wm|fw|b|d|f)_\d+(_\d+)?$/.test(k) || k === "cfg" || /^my_\d+$/.test(k) || /^st(_\d+)?$/.test(k)));
  if (vals.cfg){ try { Object.assign(S.cfg, JSON.parse(vals.cfg)); } catch(e){} }
  const myk = Object.keys(vals).filter(k => /^my_\d+$/.test(k)).sort((a, b) => +a.slice(3) - +b.slice(3));
  S.myChunks = myk.length;
  if (myk.length){ try { S.my = JSON.parse(myk.map(k => vals[k] || "").join("")); } catch(e){ S.my = []; } }
  const stk = Object.keys(vals).filter(k => /^st(_\d+)?$/.test(k) && vals[k] != null).sort((a, b) => +(a.split("_")[1] || 0) - +(b.split("_")[1] || 0));
  if (stk.length){ S.ck.st = stk.length; try { S.sets = JSON.parse(stk.map(k => vals[k]).join("")); } catch(e){ S.sets = []; } }
  // собрать части в пачки
  const packs = {};
  for (const k of Object.keys(vals)){
    const m = k.match(/^(wm|fw|b)_(\d+)(?:_(\d+))?$/); if (!m || vals[k] == null) continue;
    const base = `${m[1]}_${m[2]}`; (packs[base] = packs[base] || [])[+(m[3] || 0)] = vals[k];
  }
  for (const base in packs){
    S.ck[base] = packs[base].length;
    let v; try { v = JSON.parse(packs[base].join("")); } catch(e){ continue; }
    const [type, id] = base.split("_");
    const ym = `${id.slice(0, 4)}-${id.slice(4, 6)}`;
    if (type === "wm") for (const dd in v) S.days[`${ym}-${pad(dd)}`] = v[dd];
    if (type === "b") for (const dd in v) S.body[`${ym}-${pad(dd)}`] = v[dd];
    if (type === "fw") for (const ds in v) if (Array.isArray(v[ds])) S.food[ds] = v[ds];
  }
  // миграция со старого формата (по одной записи на день)
  const old = Object.keys(vals).filter(k => /^(d|f)_\d{8}$/.test(k));
  if (old.length){
    const wms = new Set(), fws = new Set();
    for (const k of old){
      let v; try { v = JSON.parse(vals[k]); } catch(e){ continue; }
      const n = k.slice(2), ds = `${n.slice(0, 4)}-${n.slice(4, 6)}-${n.slice(6, 8)}`;
      if (k[0] === "d"){ if (!S.days[ds]) S.days[ds] = v; wms.add(ds); }
      else if (Array.isArray(v)){ if (!S.food[ds]) S.food[ds] = v; fws.add(ds); }
    }
    try {
      for (const ds of wms) await saveDay(ds);
      for (const ds of fws) await saveFood(ds);
      for (const k of old) await Store.del(k);
    } catch(e){ console.warn("migration", e); }
  }
}
async function saveDay(ds){

}
async function saveFood(ds){
  if (S.food[ds] && !S.food[ds].length) delete S.food[ds];
  const mon = iso(mondayOf(fromIso(ds))), end = iso(addDays(fromIso(mon), 6)), obj = {};
  for (const x in S.food) if (x >= mon && x <= end) obj[x] = S.food[x];

/* ================= ЛОГИКА ================= */
const sortedDays = () => Object.keys(S.days).sort();
function lastEntry(key, beforeDs){
  const ds = sortedDays();
  for (let i = ds.length-1; i >= 0; i--){
    if (beforeDs && ds[i] >= beforeDs) continue;
    const e = S.days[ds[i]].ex && S.days[ds[i]].ex[key];

}
function entries(key){ return sortedDays().filter(ds => S.days[ds].ex && S.days[ds].ex[key]).map(ds => ({ds, ...S.days[ds].ex[key]})); }
const allHi = (key, r) => { const e = EX[key]; return r.length >= e.sets && r.slice(0, e.sets).every(x => x >= e.hi); };
const deloadW = w => Math.round(w*0.6/2.5)*2.5;
function suggest(key, beforeDs, deload){
  const e = EX[key], last = lastEntry(key, beforeDs);
  if (!last || e.kind !== "w" || last.wt == null) return null;
  const hi = allHi(key, last.r), up = hi && last.rir !== 0, t = up ? last.wt + e.step : last.wt;
  return {wt: deload ? deloadW(t) : t, up, hold: hi && last.rir === 0};
}
function adviceText(key, wt, r, deload, rir){
  const e = EX[key];
  if (deload) return "Разгрузочная неделя — прогрессию не считаем.";
  const up = allHi(key, r);
  if (e.kind === "w" && up && rir === 0) return `Максимум, но на пределе → закрепи ${fmt(wt)} кг ещё раз`;
  if (!up && rir === 3) return `Запас большой → в следующий раз добери до ${e.sets}×${e.hi}`;
  if (e.kind === "w") return up ? `Все подходы на максимуме → в следующий раз ${fmt(wt + e.step)} кг` : `Оставь ${fmt(wt)} кг, добирай до ${e.sets}×${e.hi}`;
  if (e.kind === "t") return up ? "Держишь максимум → добавь 5 с" : `Цель: ${e.sets}×${e.hi} с`;
  return up ? "Максимум во всех подходах → добавь паузу вверху" : `Цель: ${e.sets}×${e.hi}`;
}
const e1rm = (wt, r) => Math.max(...r.map(x => wt*(1 + x/30)));
/* расчётный максимум записи с учётом веса на каждый подход (ws) */
const e1x = x => x.ws ? Math.max(...x.r.map((r, i) => (x.ws[i] ?? x.wt) * (1 + r / 30))) : e1rm(x.wt, x.r);
function targetText(e, deload){
  const sets = deload ? Math.max(e.sets-1,1) : e.sets;
  const reps = e.lo === e.hi ? e.lo : `${e.lo}–${e.hi}`;

}
function entryText(key, en){
  if (!en) return "—";

}
const sessionsIn = (a, b) => Object.keys(S.days).filter(ds => S.days[ds].done && ds >= iso(a) && ds <= iso(b)).length;
const totalSessions = () => Object.values(S.days).filter(d => d.done).length;
function bodyAvg(field, from, to){
  const v = Object.keys(S.body).filter(ds => ds >= iso(from) && ds <= iso(to) && S.body[ds][field] != null).map(ds => S.body[ds][field]);
  return v.length ? {avg: v.reduce((a,b)=>a+b,0)/v.length, n: v.length} : {avg:null, n:0};
}
const lastBody = field => { const k = Object.keys(S.body).filter(ds => S.body[ds][field] != null).sort(); return k.length ? {ds:k[k.length-1], v:S.body[k[k.length-1]][field]} : null; };
const firstBody = field => { const k = Object.keys(S.body).filter(ds => S.body[ds][field] != null).sort(); return k.length ? {ds:k[0], v:S.body[k[0]][field]} : null; };

function isPR(key, ds){
  const cur = S.days[ds] && S.days[ds].ex && S.days[ds].ex[key]; if (!cur) return false;
  const prev = entries(key).filter(x => x.ds < ds); if (!prev.length) return false;

function plateau(k){

function scoreLocal(q, pool0){
  const SYN = {"шаверма":"шаурма","курочка":"кур","цыпленок":"кур","филе":"груд","кура":"кур","яйца":"яйц","яйцо":"яйц","яйцами":"яйц","свинья":"свин","яичница":"яичн","глазунья":"яичн","котлеты":"котлет","макарошки":"макарон","спагетти":"спагет","паста":"паст","сушки":"сушк","суши":"суш","картошка":"картоф","картофан":"картоф","пюрешка":"пюре","колбаска":"колбас","сосиска":"сосис","газировка":"газир","кола":"газир","минералка":"газир"};
  const stem = w => w.length >= 6 ? w.slice(0, w.length - 2) : w.length === 5 ? w.slice(0, 4) : w;
  const words = norm(q).split(/\s+/).filter(Boolean).map(w => SYN[w] || w); if (!words.length) return [];
  const pool = pool0 || S.my.map(x => ({...x, src:"my"})).concat(FOOD_DB);
  const scored = [];
  for (const it of pool){
    const nn = norm(it.n + (it.kw ? " " + it.kw : "")), toks = nn.split(/[\s(),/]+/);
    let ok = true, score = 0, exact = true;
    for (const w of words){
      if (toks.some(t => t.startsWith(w))) score += 3;
      else if (toks.some(t => t.startsWith(stem(w)))) score += 2;
      else if (nn.includes(stem(w))){ score += 1; exact = false; }
      else { ok = false; break; }
    }
    if (!ok) continue;
    if (nn.startsWith(words[0])) score += 3;
    if (toks[0] && toks[0].startsWith(stem(words[0]))) score += 2;
    if (it.src === "my") score += 2;
    score += Math.min(S.freq[it.n] || 0, 10) * 0.5;
    scored.push([score, it, exact, toks[0] === words[0] ? 1 : 0]);
  }
  return scored.sort((a, b) => b[0] - a[0] || b[3] - a[3] || a[1].n.length - b[1].n.length);
}

const NUMW = {"один":1,"одна":1,"одно":1,"одну":1,"два":2,"две":2,"три":3,"четыре":4,"пять":5,"шесть":6,"пол":0.5,"половина":0.5,"половинка":0.5,"полтора":1.5,"полторы":1.5};

const GRAMW = /^(кг|г|гр|грамм[а-я]*|мл|л)$/;
function parseAmt(txt){
  txt = String(txt).replace(/½/g, " 0.5 ").replace(/¼/g, " 0.25 ").replace(/¾/g, " 0.75 ").replace(/(\d+)\s*\/\s*(\d+)/g, (m0, a1, b1) => +b1 ? " " + String(+(a1 / b1).toFixed(2)) + " " : m0);

  let g = null, n = null, u = null;
  for (let i = 0; i < tk.length; i++){
    const w = tk[i], free = g == null && n == null;
    const mg = w.match(/^(\d+(?:[.,]\d+)?)(кг|г|гр|мл|л)$/);
    const num = /^\d+(?:[.,]\d+)?$/.test(w) ? parseFloat(w.replace(",", ".")) : (NUMW[w] ?? null);
    if (free && mg){ g = parseFloat(mg[1].replace(",", ".")) * (/^(кг|л)$/.test(mg[2]) ? 1000 : 1); continue; }

      n = num; if (UNITW.test(nx)){ u = nx; i++; } continue;

function unitG(it, u){

function parsePart(txt){

  const tot = dayTotals(ds), list = S.food[ds] || [];
  const C = 2 * Math.PI * 44, left = Math.round(T.k - tot[0]);
  const title = isToday ? "Сегодня" : (diffDays(d, today()) === -1 ? "Вчера" : `${WD_FULL[wday(d)]}`);
  let h = `<div class="row between" style="margin-bottom:6px">
    <button class="navarrow" data-a="fday" data-n="-1">‹</button>
    <div class="sub">${WD[wday(d)]}, ${dShort(d)}</div>
    <button class="navarrow" data-a="fday" data-n="1" ${isToday ? "disabled style='opacity:.3'" : ""}>›</button></div>
    <div class="row between" style="align-items:baseline"><h1>Еда · ${title}</h1>${isToday ? "" : `<button class="pill" data-a="fgotoday">↩ Сегодня</button>`}</div><div style="height:10px"></div>`;
  h += `<div class="card fsum"><div class="kring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44"/><circle class="val ${left < 0 ? "over" : ""}" style="--c:${C}" cx="50" cy="50" r="44" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.min(1, tot[0] / T.k))}"/></svg>
      <div><b data-count="${Math.round(tot[0])}" data-ck="ring">${Math.round(tot[0])}</b><span>из ${T.k} ккал</span></div></div>
    <div class="grow"><div class="kleft ${left < 0 ? "over" : ""}">${left >= 0 ? `Осталось <b>${left}</b> ккал` : `Сверх нормы <b>${-left}</b> ккал`}</div>
      ${bar("Б", tot[1], T.p, "p")}${bar("Ж", tot[2], T.f, "f")}${bar("У", tot[3], T.c, "c")}</div></div>`;

    h += `<div class="note" style="margin-top:0">Белка не хватает ${Math.round(remP)} г. Закрой творогом 5% 200 г (+34 г), куриной грудкой 150 г (+45 г) или протеином (+22 г).</div>`;
  h += `<div class="fsearch"><input id="fq" type="search" autocomplete="off" placeholder="${S.fmeal != null && curMeal() === S.fmeal ? `Добавить в ${MEAL_ACC[S.fmeal]}: что съел?` : "Что съел? 2 яйца, хлеб, кофе"}" value="${esc(S.fq)}">
    <button class="icbtn" data-a="scan" aria-label="Сканировать штрихкод"><svg viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg></button></div>
    <div id="fres">${foodResults()}</div>`;
  h += `<h2>Съедено</h2>`;
  [0,1,2,3].forEach(m => {
    const items = list.map((e, i) => [e, i]).filter(([e]) => e.m === m);
    const yN = (S.food[iso(addDays(d, -1))] || []).filter(e => e.m === m).length;
    const quick = items.length ? "" : (yN ? `<button class="chip" data-a="frepeat" data-v="${m}">↻ Как вчера · ${yN} поз.</button>` : "") + S.sets.map((st, si) => st.m === m ? `<button class="chip" data-a="setadd" data-i="${si}" data-v="${m}">★ ${esc(st.n)} · ${setKcal(st)} ккал</button>` : "").join("");
    const mt = items.reduce((s, [e]) => s + entryTotals(e)[0], 0), mp = items.reduce((s, [e]) => s + entryTotals(e)[1], 0);
    h += `<div class="card mealcard ${items.length ? "" : "empty"}"><div class="row between"><b>${MEAL_NAMES[m]}</b><span class="mh">${items.length ? `<span class="sub">${Math.round(mt)} ккал · Б ${Math.round(mp)}</span><button class="madd st" data-a="mmenu" data-v="${m}" aria-label="Действия с приёмом пищи">⋯</button>` : ""}<button class="madd" data-a="fmealadd" data-v="${m}" aria-label="Добавить в ${MEAL_ACC[m]}">＋</button></span></div>
      ${quick ? `<div class="chips mchips">${quick}</div>` : ""}
      ${items.map(([e, i]) => { const t = entryTotals(e); return `<button class="fitem" data-a="fedit" data-i="${i}"><span class="grow"><span class="fn">${esc(e.n)}</span><span class="fq">${e.g != null ? `${n1(e.g)} г` : `${n1(e.q || 1)} порц.`} · Б ${n1(t[1])} Ж ${n1(t[2])} У ${n1(t[3])}</span></span><b>${Math.round(t[0])}<small>ккал</small></b></button>`; }).join("")}
</div>`;
  });
  h += foodWeek();
  h += foodIdeas();

}

    if (pp.length > 1){ S.fres = []; return pc; }

    h += `<div class="offh">Open Food Facts</div>`;
    h += S.offRes.length ? S.offRes.map((it, i) => resRow(it, loc.length + i)).join("") : `<div class="sub" style="font-size:13px;padding:6px 0">И там не нашлось. Добавь свой продукт по этикетке.</div>`;
  } else {

function resRow(it, i){

    <span class="fq">${it.brand ? esc(it.brand) + " · " : ""}на 100 г: Б ${n1(it.b[1])} Ж ${n1(it.b[2])} У ${n1(it.b[3])}</span></span><b>${Math.round(it.b[0])}<small>ккал</small></b></button>`;
}
function foodWeek(){
  const t = today(), T = kbju(), est = tdeeEstimate();
  const logged = []; for (let i = 6; i >= 0; i--){ const ds = iso(addDays(t, -i)); if (S.food[ds]) logged.push(dayTotals(ds)); }
  const avgK = logged.length ? Math.round(logged.reduce((s, x) => s + x[0], 0) / logged.length) : null;
  const avgP = logged.length ? Math.round(logged.reduce((s, x) => s + x[1], 0) / logged.length) : null;
  let h = `<h2>Неделя</h2><div class="card"><div class="row between"><b>Калории по дням</b><span class="sub">${avgK ? `в среднем ${avgK} ккал · Б ${avgP}` : "нет записей"}</span></div>
    <div class="chart" style="height:150px"><canvas id="cFood"></canvas></div></div>`;
  h += `<div class="card"><b>Твоя реальная поддержка</b><div style="margin-top:6px;font-size:14px">`;
  if (est.tdee){
    h += `≈ <b>${est.tdee} ккал</b> в день — по ${est.n} дням записей и динамике веса (${est.rate > 0 ? "+" : ""}${fmt(est.rate.toFixed(2))} кг/нед).<br>
      <span class="sub">Для −0,5 кг/нед: ~${est.tdee - 550} ккал. Сейчас цель ${T.k} — поменять можно в «Ещё → Настройки».</span>`;
  } else {
    h += `<span class="sub">Посчитается по твоим данным, а не по формуле: нужно ещё ${est.need ? `${est.need} дн. полных записей еды` : ""}${est.need && est.wneed ? " и " : ""}${est.wneed ? `${est.wneed} взвешиваний` : ""} за 4 недели.</span>`;
  }
  return h + `</div></div>`;
}

/* Раз в неделю: цель калорий по реальной поддержке (тренд веса), шаг не больше 250 ккал */
function calAdj(){
  const est = tdeeEstimate(); if (!est.tdee) return null;
  const T = kbju(), wk = iso(mondayOf(today()));
  if (S.cfg.adjWk === wk) return null;
  const want = Math.round((est.tdee - Math.round(PLAN_RATE * 7700 / 7)) / 50) * 50;
  const k = Math.max(1700, Math.min(T.k + 250, Math.max(T.k - 250, want)));
  return Math.abs(k - T.k) >= 100 ? {k, diff: k - T.k, est, wk} : null;
}
function adjCard(){
  const x = calAdj(); if (!x) return "";
  return `<div class="card adj"><span class="pill warn">Коррекция на неделю</span>
    <div style="margin-top:8px;font-size:14px">Темп ${sgn(x.est.rate)} кг/нед при ${x.est.avg.toLocaleString("ru-RU")} ккал в среднем. Реальная поддержка ≈ ${x.est.tdee.toLocaleString("ru-RU")} ккал.
    Для −${fmt(PLAN_RATE)} кг/нед предлагаю <b>${x.k.toLocaleString("ru-RU")} ккал</b> (${x.diff > 0 ? "+" : "−"}${Math.abs(x.diff)}).</div>
    <div class="row"><button class="btn" data-a="adjok">Применить</button><button class="btn sec" data-a="adjno">Не сейчас</button></div></div>`;
}

const OFF_FIELDS = "code,product_name,product_name_ru,brands,nutriments,serving_quantity,quantity";
function offMap(p){
  const nu = p.nutriments || {};

async function openScan(){
  S.scanOpen = true;

    <div class="row between"><div class="ex-name" style="font-size:18px">Штрихкод</div><button data-a="close" aria-label="Закрыть" style="font-size:24px;color:var(--hint);padding:0 8px">×</button></div>

  $("#sheet").classList.add("open"); try { tg.BackButton.show(); } catch(e){}

    if ("BarcodeDetector" in window){

    }

async function findBarcode(code){

  try {

    if (!it){ closeSheet(); toast("Продукта нет в базе — добавь по этикетке"); setTimeout(() => openMySheet("", {code}), 50); return; }

/* prev — значения счётчиков до перерисовки того же экрана: анимируем только изменившиеся, от старого значения */
function countUp(prev){
  document.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, dec = +(el.dataset.dec || 0), from = prev ? prev[el.dataset.ck] : 0;
    if (!(to > 0) || el.dataset.done || from == null || from === to) return;
    el.dataset.done = 1; const t0 = performance.now(), dur = prev ? 400 : 550;
    const step = now => { const k = Math.min(1, (now - t0) / dur), v = from + (to - from) * (1 - Math.pow(1 - k, 3)); el.textContent = dec ? fmt(v.toFixed(dec)) : Math.round(v); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function sheetInit(k, orig){
  const ds = iso(S.cur), deload = isDeload(S.cur), e = EX[k];
  const cur = S.days[ds] && S.days[ds].ex && S.days[ds].ex[k];
  const last = lastEntry(k, ds), sug = suggest(k, ds, deload);
  const sets = deload ? Math.max(e.sets-1,1) : e.sets;
  let wt = null, r;
  if (e.kind === "w") wt = cur ? cur.wt : (sug ? sug.wt : (last ? last.wt : e.def));
  if (cur) r = cur.r.slice();
  else if (last && !(sug && sug.up)) r = last.r.slice(0, sets);
  else r = Array(sets).fill(e.kind === "t" ? e.lo : e.lo);
  while (r.length < sets) r.push(r[r.length-1] || e.lo);
  const ws = r.map((x, i) => cur && cur.ws && cur.ws[i] != null && cur.ws[i] !== wt ? cur.ws[i] : null);
  return {k, wt, r, ws, edit: !!cur, orig: orig || k, rir: cur && cur.rir != null ? cur.rir : null, note: cur ? (cur.note || "") : ((last && last.note) || "")};
}
function openSheet(k, orig){
  S.sheet = sheetInit(k, orig);
  renderSheet();
  try { if (tg.isVersionAtLeast("6.2")) tg.enableClosingConfirmation(); } catch(err){}

  try { tg.BackButton.show(); } catch(err){}
}

    <div class="shead ${W ? "" : "nw"}"><span>№</span>${W ? "<span>Вес</span>" : ""}<span>${e.kind === "t" ? "Секунды" : "Повторы"}</span><span style="text-align:right">Прошлый</span></div>

function readSheet(){
  const s = S.sheet; if (!s) return;
  const w = $("#wtIn"); if (w){ const v = parseFloat(w.value.replace(",", ".")); if (!isNaN(v)) s.wt = v; }
  document.querySelectorAll("[data-rep]").forEach(inp => { const v = parseInt(inp.value, 10); if (!isNaN(v)) s.r[+inp.dataset.rep] = v; });
  document.querySelectorAll("[data-sw]").forEach(inp => { const v = parseFloat(inp.value.replace(",", ".")); s.ws[+inp.dataset.sw] = !isNaN(v) && v > 0 && v !== s.wt ? v : null; });
  const nt = $("#exNote"); if (nt) s.note = nt.value.trim().slice(0, 80);
}

/* Записать упражнение: из шторки или галочкой на карточке (quick) */
async function commitEntry(sh, quick){
  const {k, wt, r, ws, rir, note} = sh, ds = iso(S.cur), e = EX[k];
  const idx = r.map((x, i) => i).filter(i => r[i] > 0), reps = idx.map(i => r[i]);
  if (!reps.length || (e.kind === "w" && !(wt > 0))){ toast("Проверь вес и повторы"); return false; }
  const w = workoutFor(S.cur) || S.override || workoutFor(nextTraining(S.cur));
  S.days[ds] = S.days[ds] || {w, ex:{}}; S.days[ds].ex = S.days[ds].ex || {};
  const rec = {};
  if (e.kind === "w"){ const wl = idx.map(i => ws && ws[i] != null ? ws[i] : wt); rec.wt = Math.max(...wl); rec.r = reps; if (wl.some(x => x !== rec.wt)) rec.ws = wl; }
  else rec.r = reps;
  if (rir != null && e.kind !== "t") rec.rir = rir;
  if (note) rec.note = note;
  S.days[ds].ex[k] = rec;
  await saveDay(ds); haptic("ok"); if (!quick) closeSheet(); render();
  const left = plannedList(w, S.days[ds]).filter(x => !S.days[ds].ex[x]).length;
  const tail = left ? "" : " · Всё записано — жми «Завершить»";
  const act = quick ? {label: "Изменить", fn: () => openSheet(k, sh.orig)} : null;
  if (isPR(k, ds)){ confetti(); toast(`Новый рекорд: ${e.name}, ${entryText(k, rec)}${tail}`, act); }
  else toast((quick ? `${e.name}: ${entryText(k, rec)}` : adviceText(k, rec.wt, reps, isDeload(S.cur), rir)) + tail, act);
  return true;
}

document.addEventListener("click", async ev => {

  if (a === "tab"){ S.wOpen = false; if (el.dataset.v === "progress") S.sumOff = null; S.view = el.dataset.v; haptic("light"); render(); window.scrollTo(0,0); }
  if (a === "day"){ S.cur = addDays(S.cur, +el.dataset.n); S.override = null; haptic("light"); render(); }
  if (a === "override"){ S.override = el.dataset.v; render(); }
  if (a === "open"){ haptic("light"); openSheet(el.dataset.k, el.dataset.o); }
  if (a === "pseg"){ S.pseg = el.dataset.v; haptic("light"); render(); }
  if (a === "addfood"){ S.view = "food"; S.fdate = today(); render(); window.scrollTo(0,0); setTimeout(() => { const q = $("#fq"); if (q) q.focus(); }, 60); }
  if (a === "gobackup"){ S.view = "more"; S.moreTab = "data"; render(); setTimeout(() => { const b = $("#backup"); if (b) b.scrollIntoView({behavior:"smooth"}); }, 60); }
  if (a === "wedit"){ S.view = "progress"; S.pseg = "body"; S.bodyDate = iso(today()); render(); setTimeout(() => { const b = $("#bform"); if (b) b.scrollIntoView({behavior:"smooth"}); }, 60); }
  if (a === "qw"){ const inp = $("#qW"); inp.value = fmt(+(parseFloat(inp.value.replace(",", ".")) + (+el.dataset.s)).toFixed(1)); haptic("light"); }
  if (a === "qwsave"){
    const w = parseFloat($("#qW").value.replace(",", ".")), ds = iso(today());
    if (!(w > 30 && w < 300)){ toast("Проверь вес"); return; }
    S.body[ds] = Object.assign(S.body[ds] || {}, {w}); await saveBodyMonth(ds.slice(0,7)); haptic("ok"); render(); toast("Вес записан");
  }
  if (a === "ppick"){
    if (S.sheet){ readSheet(); const ds = iso(S.cur), day = S.days[ds] || {}; const orig = S.sheet.orig, hasSub = !!(day.sub && day.sub[orig]); openPicker("today", {src:S.sheet.k, orig, allowToday:true, hasSub, w: workoutFor(S.cur) || S.override || workoutFor(nextTraining(S.cur))}); }
    else if (S.psheet){ const p = S.psheet; openPicker("forever", {src:p.k, orig:p.k, w:p.w, i:p.i}); }
  }
  if (a === "pmode"){ S.picker.mode = el.dataset.v; openPicker(S.picker.mode, S.picker); }
  if (a === "unsub"){ const ds = iso(S.cur); delete S.days[ds].sub[S.picker.orig]; await saveDay(ds); closeSheet(); render(); toast("Вернул исходное упражнение"); }
  if (a === "pickex"){
    const k = el.dataset.k, pk = S.picker;
    if (pk.mode === "add"){ const pr = progOf(pk.w); pr.push(k); S.cfg.prog = Object.assign({}, S.cfg.prog, {[pk.w]: pr}); }
    else if (pk.mode === "forever"){
      const w = pk.w, pr = progOf(w), idx = pk.i != null ? pk.i : pr.indexOf(pk.orig);
      if (idx < 0){ toast("Не нашёл упражнение в программе"); return; }
      pr[idx] = k; S.cfg.prog = Object.assign({}, S.cfg.prog, {[w]: pr});
      const ds = iso(S.cur); if (S.days[ds] && S.days[ds].sub && S.days[ds].sub[pk.orig]){ delete S.days[ds].sub[pk.orig]; await saveDay(ds); }
    } else {
      const ds = iso(S.cur), w = pk.w;
      S.days[ds] = S.days[ds] || {w, ex:{}}; S.days[ds].sub = S.days[ds].sub || {};
      if (k === pk.orig) delete S.days[ds].sub[pk.orig]; else S.days[ds].sub[pk.orig] = k;
      await saveDay(ds); haptic("ok"); closeSheet(); render(); toast(`Сегодня: ${EX[k].name}`); return;
    }
    applyProgram(); await saveCfg(); haptic("ok"); closeSheet(); render(); toast(pk.mode === "add" ? `Добавлено: ${EX[k].name}` : `В программе: ${EX[k].name}`);
  }

  if (ev.key === "Enter" && ev.target.id === "fq"){ ev.target.blur(); if (!phraseParse(S.fq) && !searchLocal(S.fq).length) document.querySelector('[data-a="offsearch"]')?.click(); }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "bDate"){ S.bodyDate = ev.target.value; render(); }
});

/* ===== Нижняя кнопка Telegram: главное действие экрана или шторки ([data-main]) ===== */
const MB = inTG && tg.MainButton && tg.isVersionAtLeast && tg.isVersionAtLeast("6.1") ? tg.MainButton : null;
let mainEl = null, mainQ = false;
const toHex = c => { const m = String(c).match(/\d+(\.\d+)?/g); return m && m.length >= 3 ? "#" + m.slice(0, 3).map(x => (+x).toString(16).padStart(2, "0")).join("") : null; };
function syncMain(){
  mainQ = false;
  const open = $("#sheet").classList.contains("open");
  const el = open ? $("#panel [data-main]") : $("#view [data-main]");
  mainEl = el;
  document.body.classList.toggle("tgmain", !!(MB && el));
  if (!MB) return;
  if (el){ const p = {text: el.textContent.trim(), is_visible: true, is_active: true}; const c = toHex(colorOf("--accent")); if (c) p.color = c; MB.setParams(p); }
  else MB.hide();
}
if (MB) MB.onClick(() => { if (mainEl && mainEl.isConnected) mainEl.click(); });
const mo = new MutationObserver(() => { if (!mainQ){ mainQ = true; requestAnimationFrame(syncMain); } });
mo.observe($("#view"), {childList:true, subtree:true}); mo.observe($("#panel"), {childList:true, subtree:true}); mo.observe($("#sheet"), {attributes:true, attributeFilter:["class"]});

/* Свайп влево/вправо по экрану «Сегодня» и «Еда» листает дни */
(function(){
  let x0 = null, y0 = 0, t0 = 0;
  const v = $("#view");
  v.addEventListener("touchstart", e => {
    const ok = (S.view === "today" || S.view === "food") && !$("#sheet").classList.contains("open") && !e.target.closest(".chips,input,textarea,canvas,.cal,.seg,.stepper,.mini-step");
    x0 = ok ? e.touches[0].clientX : null; y0 = e.touches[0].clientY; t0 = Date.now();
  }, {passive:true});
  v.addEventListener("touchend", e => {
    if (x0 == null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 45 || Math.abs(dx) < Math.abs(dy) * 2 || Date.now() - t0 > 700) return;
    const n = dx < 0 ? 1 : -1;
    if (S.view === "today"){ S.cur = addDays(S.cur, n); S.override = null; S.wOpen = false; haptic("light"); render(); }
    else { const nd = addDays(S.fdate, n); if (nd <= today()){ S.fdate = nd; S.fq = ""; S.fmeal = null; haptic("light"); render(); } }
  }, {passive:true});
})();

/* Свайп шторки вниз закрывает её */
(function(){
  const p = $("#panel"); let y0 = null, dy = 0;
  p.addEventListener("touchstart", e => { y0 = p.scrollTop <= 0 && !e.target.closest("input,textarea,.chips,.stepper,.seg,select") ? e.touches[0].clientY : null; dy = 0; }, {passive:true});
  p.addEventListener("touchmove", e => { if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy > 0){ p.style.transition = "none"; p.style.transform = `translateY(${dy}px)`; } }, {passive:true});
  p.addEventListener("touchend", () => {
    if (y0 == null) return; y0 = null; p.style.transition = "transform .18s ease-out";
    if (dy > 90){ p.style.transform = "translateY(100%)"; setTimeout(() => { closeSheet(); p.style.transform = ""; p.style.transition = ""; }, 170); }
    else p.style.transform = "";
  });
})();

/* ================= СТАРТ ================= */
(async function init(){
  if (tg){
    try { tg.ready(); tg.expand(); } catch(e){}
    try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch(e){}
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){}
    try { tg.BackButton.onClick(closeSheet); } catch(e){}
    try { tg.onEvent("themeChanged", render); } catch(e){}
    try { if (tg.SettingsButton && tg.isVersionAtLeast("7.0")){ tg.SettingsButton.show(); tg.SettingsButton.onClick(() => { closeSheet(); S.view = "more"; S.moreTab = "data"; render(); window.scrollTo(0,0); }); } } catch(e){}
  }
  applyTheme();
  try { await loadAll(); } catch(e){ toast("Не удалось загрузить данные: " + e); }
  applyProgram(); buildFreq();
  applyTheme();
  render();
})();
</script>
