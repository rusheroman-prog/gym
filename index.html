<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Зал</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --fb-bg:#f1f1f5;--fb-card:#fff;--fb-text:#141416;--fb-hint:#8b8b93;--fb-accent:#2f7cf6;--fb-sep:rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){:root{--fb-bg:#0f0f11;--fb-card:#1c1c20;--fb-text:#f2f2f4;--fb-hint:#8d8d96;--fb-accent:#4a8fff;--fb-sep:rgba(255,255,255,.08)}}
:root{
  --bg:var(--tg-theme-secondary-bg-color,var(--fb-bg));
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,var(--fb-card)));
  --text:var(--tg-theme-text-color,var(--fb-text));
  --hint:var(--tg-theme-hint-color,var(--fb-hint));
  --accent:var(--tg-theme-button-color,var(--fb-accent));
  --accent-text:var(--tg-theme-button-text-color,#fff);
  --link:var(--tg-theme-accent-text-color,var(--tg-theme-link-color,var(--fb-accent)));
  --sep:var(--tg-theme-section-separator-color,var(--fb-sep));
  --danger:var(--tg-theme-destructive-text-color,#e5484d);
  --good:#2fb36b;--warn:#e8930c;
  --safe-b:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
#view{padding:12px 14px calc(84px + var(--safe-b));max-width:560px;margin:0 auto}
h1{font-size:26px;line-height:1.15;margin:4px 0 2px;font-weight:700;letter-spacing:-.3px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--hint);margin:22px 4px 8px}
.sub{color:var(--hint);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--link)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.muted{background:color-mix(in srgb,var(--hint) 16%,transparent);color:var(--hint)}
.note{font-size:13px;color:var(--hint);padding:10px 14px;border-radius:14px;border:1px dashed var(--sep);margin:8px 0}
.ex{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left}
.num{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--link)}
.num.done{background:var(--good);color:#fff}
.ex-name{font-weight:600;font-size:16px}
.ex-meta{font-size:13px;color:var(--hint);margin-top:2px}
.ex-last{font-size:13px;margin-top:6px}
.chev{color:var(--hint);font-size:20px;line-height:30px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:16px;text-align:center}
.btn.sec{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--link)}
.btn.ghost{background:transparent;color:var(--danger);font-weight:500}
.btn:active{opacity:.75}
.seg{display:flex;background:color-mix(in srgb,var(--hint) 14%,transparent);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--card);color:var(--hint)}
.chip.on{background:var(--accent);color:var(--accent-text)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:22px;letter-spacing:-.3px}
.stat span{font-size:12px;color:var(--hint)}
.chart{position:relative;height:210px}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--sep);font-size:14px}
.list-item:first-child{border-top:0}
.navarrow{width:36px;height:36px;border-radius:12px;background:var(--card);font-size:20px;display:grid;place-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 0;border-top:1px solid var(--sep);vertical-align:top}
tr:first-child td{border-top:0}
td:last-child{text-align:right;font-weight:600}
details{background:var(--card);border-radius:14px;margin-bottom:8px;padding:0 14px}
summary{padding:13px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--hint)}
details[open] summary::after{content:"－"}
details p{margin:0 0 14px;font-size:14px;color:var(--text);white-space:pre-line}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);color:var(--text);padding:10px;font:12px ui-monospace,monospace}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--sep);display:flex;padding:6px 6px calc(6px + var(--safe-b));z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--hint);padding:4px 0}
nav button.on{color:var(--link)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* sheet */
#sheet{position:fixed;inset:0;z-index:10;display:none}
#sheet.open{display:block}
#sheet .shade{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fade .2s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px 16px calc(16px + var(--safe-b));animation:up .22s ease-out;max-width:560px;margin:0 auto}
.grab{width:38px;height:5px;border-radius:9px;background:var(--sep);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@keyframes fade{from{opacity:0}}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--link);font-size:22px;font-weight:600;flex:none}
.stepper input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);text-align:center;font-size:20px;font-weight:700}
.set-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.set-row label{flex:none;white-space:nowrap;font-size:13px;color:var(--hint)}
.set-row .stepper{flex:1;min-width:0}
.set-row .stepper button{width:40px;height:40px}
.set-row .stepper input{height:40px;font-size:18px}
.small-actions{display:flex;gap:8px;margin:6px 0 14px}
.small-actions button{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--hint) 12%,transparent)}
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(20,20,22,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;max-width:90vw;transition:.25s;pointer-events:none;z-index:20;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:60px 0;text-align:center;color:var(--hint)}
.ring-card{display:flex;align-items:center;gap:16px}
.ring-wrap{position:relative;width:64px;height:64px;flex:none}
.ring-wrap svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring-wrap circle{fill:none;stroke-width:7}
.ring-wrap .track{stroke:color-mix(in srgb,var(--accent) 14%,transparent)}
.ring-wrap .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-wrap b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.wdots{display:flex;gap:12px;margin-top:8px}
.wdot{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--hint)}
.wdot i{width:16px;height:16px;border-radius:50%;background:color-mix(in srgb,var(--hint) 20%,transparent)}
.wdot i.done{background:var(--good)}
.wdot i.today{background:transparent;box-shadow:inset 0 0 0 2.5px var(--accent)}
.wdot i.miss{background:color-mix(in srgb,var(--danger) 35%,transparent)}
.cal{display:grid;grid-template-columns:20px repeat(12,1fr);gap:4px;margin-top:12px}
.cal span{font-size:10px;color:var(--hint);line-height:1;align-self:center}
.cal i{aspect-ratio:1;border-radius:5px;background:color-mix(in srgb,var(--hint) 11%,transparent)}
.cal i.plan{background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 50%,transparent)}
.cal i.done{background:var(--accent)}
.cal i.miss{background:color-mix(in srgb,var(--danger) 32%,transparent)}
.cal i.today{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--hint);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.scheme{width:100%;height:auto;display:block;margin:2px 0 4px}
.scheme .k{fill:none;stroke:var(--hint);stroke-width:2.2;stroke-linecap:round;opacity:.75}
.scheme .b{fill:none;stroke:var(--text);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.scheme .h{fill:none;stroke:var(--text);stroke-width:2.6}
.scheme .pl{fill:color-mix(in srgb,var(--accent) 24%,transparent);stroke:var(--accent);stroke-width:1.6}
.scheme .g{fill:none;stroke:var(--hint);stroke-width:1.3;stroke-dasharray:4 4}
.scheme .mv{fill:none;stroke:var(--warn);stroke-width:2.2}
.scheme .st{fill:none;stroke:var(--hint);stroke-width:1.4}
.scheme .lb{font-size:15px;fill:var(--hint);text-anchor:middle}
.scheme .lb.good{fill:var(--good)} .scheme .lb.bad{fill:var(--danger)}
.scheme .cn circle{fill:var(--accent)}
.scheme .cn text{fill:var(--accent-text);font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.cues{margin:0 0 12px;padding:0;list-style:none;font-size:14px}
.cues li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.cues b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-text);font-size:12px;display:grid;place-items:center}
.colors{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.colors button{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--card);position:relative}
.colors button.on{outline:3px solid var(--text);outline-offset:1px}
.colors .tgc{background:conic-gradient(#2f7cf6 0 50%,#33b5e5 0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:45%;left:50%;width:8px;height:12px;border-radius:2px;animation:boom 1.4s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes boom{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.pr{color:var(--warn)}
</style>
</head>
<body>
<div id="view"><div class="loading">Загрузка…</div></div>
<nav id="nav">
  <button data-a="tab" data-v="today" class="on"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>Тренировка</button>
  <button data-a="tab" data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-4 3 3 5-6"/><path d="M15 8h3v3"/></svg>Прогресс</button>
  <button data-a="tab" data-v="body"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 10a4.5 4.5 0 0 1 7 0M12 10l1.3-2"/></svg>Тело</button>
  <button data-a="tab" data-v="more"><svg viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.2"/></svg>Ещё</button>
</nav>
<div id="sheet"><div class="shade" data-a="close"></div><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script>
/* ================= ПРОГРАММА ================= */
const START = new Date(2026, 8, 28);        // пн первой недели
const CHECKPOINT = new Date(2026, 10, 23);  // контрольный замер
const START_WEIGHT = 90;
const SLOTS = {0: 0, 2: 1, 4: 2};           // Пн, Ср, Пт
const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const WD_FULL = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const MON = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];

const EX = {
  squat:   {name:"Приседания со штангой", sets:3, lo:8, hi:10, step:5, rest:"2 мин", kind:"w", def:40,
    tech:"Гриф на верхе трапеций, стопы на ширине плеч, носки чуть врозь.\nСадишься, отводя таз назад, до параллели бедра с полом. Колени по линии носков, спина ровная.\nВстаёшь, давя всей стопой.\nАльтернатива: гоблет-присед — гантель у груди."},
  bench:   {name:"Жим штанги лёжа", sets:3, lo:6, hi:8, step:2.5, rest:"2 мин", kind:"w", def:62.5,
    tech:"Лопатки сведены и прижаты к скамье, стопы в пол. Хват чуть шире плеч.\nОпускаешь гриф к низу груди, локти ~45° к корпусу, выжимаешь вверх."},
  latpd:   {name:"Тяга верхнего блока", sets:3, lo:10, hi:12, step:2.5, rest:"90 с", kind:"w", def:40,

  rdl:     {name:"Румынская тяга", sets:3, lo:10, hi:10, step:5, rest:"90 с", kind:"w", def:40,

  plank:   {name:"Планка", sets:3, lo:30, hi:45, step:5, rest:"45 с", kind:"t",
    tech:"Упор на предплечья, локти под плечами. Голова, плечи, пятки в одну линию.\nПресс и ягодицы напряжены, таз не провисает и не задран."},
  legpress:{name:"Жим ногами", sets:3, lo:10, hi:12, step:5, rest:"2 мин", kind:"w", def:80,

  incline: {name:"Жим гантелей на наклонной", sets:3, lo:8, hi:10, step:2, rest:"90 с", kind:"w", def:16,
    tech:"Скамья под 30°.\nГантели опускаешь к краям груди, локти ~45° к корпусу, выжимаешь вверх."},
  row:     {name:"Тяга горизонтального блока", sets:3, lo:10, hi:12, step:2.5, rest:"90 с", kind:"w", def:40,
    tech:"Сидя, колени слегка согнуты, спина прямая.\nТянешь рукоять к низу живота, локти назад, лопатки вместе. Корпус не раскачиваешь."},
  lunge:   {name:"Выпады с гантелями", sets:3, lo:10, hi:10, step:2, rest:"90 с", kind:"w", def:10, per:"на ногу",
    tech:"Шаг вперёд, опускаешься до ~90° в обоих коленях, корпус вертикально.\nКолено над стопой, заднее почти у пола. Толкаешься передней пяткой.\nВес — одной гантели."},
  facepull:{name:"Face pull", sets:3, lo:15, hi:15, step:2.5, rest:"60 с", kind:"w", def:15,
    tech:"Канат на блоке на уровне глаз.\nТянешь к переносице, разводя концы каната, локти в стороны и вверх, лопатки сводишь в конце. Вес лёгкий.\nБез блока: разведения гантелей в наклоне 3×15."},
  kneeraise:{name:"Подъём коленей в висе", sets:3, lo:10, hi:15, step:0, rest:"60 с", kind:"b",
    tech:"Вис на турнике. Поднимаешь колени к груди, подкручивая таз.\nВниз медленно, без раскачки. Тяжело — делай на брусьях с упором локтями."},

const WORKOUTS = {A:["squat","bench","latpd","rdl","ohp","plank"], B:["legpress","incline","row","lunge","facepull","kneeraise"]};

/* Схемы: вид сбоку, слева старт, справа конечная точка. c: [x, y, текст подсказки] */
const SCH = {
  squat:{a:{kit:"M90 208 H250",head:[172,54],pl:[166,78],body:["M170 66 L170 138 L172 174 L170 208 L194 208","M170 82 L152 96 L160 78"]},

  bench:{a:{kit:"M90 152 H250 M110 152 V206 M230 152 V206 M84 208 H256",head:[104,136],pl:[126,72],body:["M118 142 L200 142 L234 124 L244 206","M124 142 L126 80"]},
    b:{kit:"M360 152 H520 M380 152 V206 M500 152 V206 M354 208 H526",head:[374,136],pl:[412,120],body:["M388 142 L470 142 L504 124 L514 206","M394 142 L412 158 L412 132"]},
    mv:"M444 64 V100",lb:["Старт","Нижняя точка"],

  latpd:{a:{kit:"M150 48 H200 M175 48 V38 M140 164 H200 M170 164 V206 M196 146 H218 M84 208 H256",head:[158,80],body:["M162 94 L170 160 L206 160 L206 206 L222 206","M162 98 L176 72 L184 48"]},
    b:{kit:"M390 100 H430 M410 100 V38 M370 164 H430 M400 164 V206 M426 146 H448 M354 208 H526",head:[388,80],body:["M392 94 L400 160 L436 160 L436 206 L452 206","M392 100 L380 128 L408 100"]},
    mv:"M456 50 V88",lb:["Старт","Финиш"],
    c:[[408,100,"Рукоять к верху груди"],[380,128,"Локти вниз и назад"],[448,146,"Бёдра зажаты валиком"],[398,140,"Корпус чуть отклонён назад"]]},
  rdl:{a:{kit:"M84 208 H256",head:[172,54],pl:[178,152],body:["M170 66 L170 138 L174 174 L172 208 L196 208","M170 82 L176 146"]},
    b:{kit:"M354 208 H526",head:[484,102],pl:[464,184],body:["M472 112 L412 140 L446 172 L440 208 L464 208","M470 116 L466 176"]},

const PLAN_RATE = 0.5; // кг в неделю — пунктир на графике веса

/* ================= ДАТЫ ================= */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diffDays = (a, b) => Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()) - Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/864e5);
const wday = d => (d.getDay()+6) % 7;
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const weekNo = d => Math.floor(diffDays(d, START)/7) + 1;
const isDeload = d => { const w = weekNo(d); return w > 0 && w % 7 === 0; };
const mondayOf = d => addDays(d, -wday(d));
function workoutFor(d){
  const s = SLOTS[wday(d)]; if (s === undefined) return null;
  const i = (weekNo(d)-1)*3 + s; return ((i % 2) + 2) % 2 === 0 ? "A" : "B";
}
function nextTraining(d){ for (let i=0;i<8;i++){ const x = addDays(d,i); if (workoutFor(x)) return x; } return d; }
const dShort = d => `${d.getDate()} ${MON[d.getMonth()]}`;
const dDM = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}`;
const fmt = n => n == null ? "—" : String(+(+n).toFixed(2)).replace(".", ",");

/* ================= ХРАНИЛИЩЕ ================= */
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const PFX = "gym_";
const mem = {};
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } },
  keys(){ try { return Object.keys(localStorage); } catch(e){ return Object.keys(mem); } }
};
const Store = {
  cloud: !!(inTG && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")),
  call(m, ...a){ return new Promise((res, rej) => tg.CloudStorage[m](...a, (e, v) => e ? rej(e) : res(v))); },
  async keys(){ return this.cloud ? await this.call("getKeys") : ls.keys().filter(k => k.startsWith(PFX)).map(k => k.slice(PFX.length)); },
  async getMany(keys){
    const out = {};
    if (!this.cloud){ keys.forEach(k => out[k] = ls.get(PFX+k)); return out; }
    for (let i=0;i<keys.length;i+=20) Object.assign(out, await this.call("getItems", keys.slice(i, i+20)));
    return out;
  },
  async set(k, v){ return this.cloud ? this.call("setItem", k, v) : ls.set(PFX+k, v); },
  async del(k){ return this.cloud ? this.call("removeItem", k) : ls.del(PFX+k); }
};

/* days: {"2026-09-28": {w:"A", done:true, ex:{bench:{wt:62.5, r:[8,8,8]}}}}
   body: {"2026-09-28": {w:90, t:98}} (w — вес, t — талия) */
const S = { cfg:{theme:"violet"}, days:{}, body:{}, view:"today", cur:today(), override:null, prog:"bench", moreTab:"schedule", sheet:null };
const dayKey = ds => "d_" + ds.replace(/-/g, "");
const monthKey = ym => "b_" + ym.replace("-", "");

async function loadAll(){
  const keys = (await Store.keys()).filter(k => /^(d|b)_\d+$/.test(k) || k === "cfg");
  const vals = await Store.getMany(keys);
  if (vals.cfg){ try { Object.assign(S.cfg, JSON.parse(vals.cfg)); } catch(e){} }
  for (const k of keys){
    if (!vals[k] || k === "cfg") continue;
    let v; try { v = JSON.parse(vals[k]); } catch(e){ continue; }
    const n = k.slice(2);
    if (k[0] === "d") S.days[`${n.slice(0,4)}-${n.slice(4,6)}-${n.slice(6,8)}`] = v;
    else for (const dd in v) S.body[`${n.slice(0,4)}-${n.slice(4,6)}-${pad(dd)}`] = v[dd];
  }
}
async function saveDay(ds){
  const d = S.days[ds];
  if (!d || (!d.done && !Object.keys(d.ex||{}).length)){ delete S.days[ds]; return Store.del(dayKey(ds)); }
  return Store.set(dayKey(ds), JSON.stringify(d));
}
async function saveBodyMonth(ym){
  const obj = {};
  for (const ds in S.body) if (ds.startsWith(ym)) obj[+ds.slice(8)] = S.body[ds];
  return Object.keys(obj).length ? Store.set(monthKey(ym), JSON.stringify(obj)) : Store.del(monthKey(ym));
}

/* ================= ЛОГИКА ================= */
const sortedDays = () => Object.keys(S.days).sort();
function lastEntry(key, beforeDs){
  const ds = sortedDays();
  for (let i = ds.length-1; i >= 0; i--){
    if (beforeDs && ds[i] >= beforeDs) continue;
    const e = S.days[ds[i]].ex && S.days[ds[i]].ex[key];
    if (e) return {ds: ds[i], ...e};
  }
  return null;
}
function entries(key){ return sortedDays().filter(ds => S.days[ds].ex && S.days[ds].ex[key]).map(ds => ({ds, ...S.days[ds].ex[key]})); }
const allHi = (key, r) => { const e = EX[key]; return r.length >= e.sets && r.slice(0, e.sets).every(x => x >= e.hi); };
const deloadW = w => Math.round(w*0.6/2.5)*2.5;
function suggest(key, beforeDs, deload){
  const e = EX[key], last = lastEntry(key, beforeDs);
  if (!last || e.kind !== "w" || last.wt == null) return null;
  const up = allHi(key, last.r), t = up ? last.wt + e.step : last.wt;
  return {wt: deload ? deloadW(t) : t, up};
}
function adviceText(key, wt, r, deload){
  const e = EX[key];
  if (deload) return "Разгрузочная неделя — прогрессию не считаем.";
  const up = allHi(key, r);
  if (e.kind === "w") return up ? `Все подходы на максимуме → в следующий раз ${fmt(wt + e.step)} кг` : `Оставь ${fmt(wt)} кг, добирай до ${e.sets}×${e.hi}`;
  if (e.kind === "t") return up ? "Держишь максимум → добавь 5 с" : `Цель: ${e.sets}×${e.hi} с`;
  return up ? "Максимум во всех подходах → добавь паузу вверху" : `Цель: ${e.sets}×${e.hi}`;
}
const e1rm = (wt, r) => Math.max(...r.map(x => wt*(1 + x/30)));
function targetText(e, deload){
  const sets = deload ? Math.max(e.sets-1,1) : e.sets;
  const reps = e.lo === e.hi ? e.lo : `${e.lo}–${e.hi}`;
  return `${sets} × ${reps}${e.kind==="t" ? " с" : ""}${e.per ? " " + e.per : ""}`;
}
function entryText(key, en){
  if (!en) return "—";
  const r = en.r.join(" ");
  return en.wt != null && EX[key].kind === "w" ? `${fmt(en.wt)} кг × ${r}` : (EX[key].kind === "t" ? `${r} с` : r);
}
const sessionsIn = (a, b) => Object.keys(S.days).filter(ds => S.days[ds].done && ds >= iso(a) && ds <= iso(b)).length;
const totalSessions = () => Object.values(S.days).filter(d => d.done).length;
function bodyAvg(field, from, to){
  const v = Object.keys(S.body).filter(ds => ds >= iso(from) && ds <= iso(to) && S.body[ds][field] != null).map(ds => S.body[ds][field]);
  return v.length ? {avg: v.reduce((a,b)=>a+b,0)/v.length, n: v.length} : {avg:null, n:0};
}
const lastBody = field => { const k = Object.keys(S.body).filter(ds => S.body[ds][field] != null).sort(); return k.length ? {ds:k[k.length-1], v:S.body[k[k.length-1]][field]} : null; };
const firstBody = field => { const k = Object.keys(S.body).filter(ds => S.body[ds][field] != null).sort(); return k.length ? {ds:k[0], v:S.body[k[0]][field]} : null; };

function isPR(key, ds){
  const cur = S.days[ds] && S.days[ds].ex && S.days[ds].ex[key]; if (!cur) return false;
  const prev = entries(key).filter(x => x.ds < ds); if (!prev.length) return false;
  if (EX[key].kind === "w") return cur.wt > Math.max(...prev.map(x => x.wt)) || e1rm(cur.wt, cur.r) > Math.max(...prev.map(x => e1rm(x.wt, x.r))) + 0.05;
  return Math.max(...cur.r) > Math.max(...prev.map(x => Math.max(...x.r)));
}
const prCount = () => Object.keys(EX).reduce((n, k) => n + entries(k).filter(x => isPR(k, x.ds)).length, 0);
function weekStreak(){
  let m = mondayOf(today());
  if (sessionsIn(m, addDays(m,6)) < 3) m = addDays(m, -7);
  let n = 0;
  while (m >= START && sessionsIn(m, addDays(m,6)) >= 3){ n++; m = addDays(m, -7); }
  return n;
}
const planWeight = d => diffDays(d, START) < 0 ? null : +(START_WEIGHT - PLAN_RATE * diffDays(d, START) / 7).toFixed(2);

  const deload = isDeload(d), day = S.days[ds] || {};
  const logged = day.ex || {};
  const title = isToday ? "Сегодня" : (diffDays(d, today()) === -1 ? "Вчера" : (diffDays(d, today()) === 1 ? "Завтра" : WD_FULL[wday(d)]));

function vProgress(){

  let best = "—";
  if (e.kind === "w" && list.length) best = fmt(Math.round(Math.max(...list.map(x => e1rm(x.wt, x.r)))*2)/2) + " кг";
  let change = "—";
  if (list.length > 1){
    const a = list[0], b = list[list.length-1];
    change = e.kind === "w" ? `${b.wt-a.wt>=0?"+":""}${fmt(b.wt-a.wt)} кг` : `${Math.max(...b.r)-Math.max(...a.r)>=0?"+":""}${Math.max(...b.r)-Math.max(...a.r)}`;

    <div class="stat"><b>${prCount()} 🏆</b><span>личных рекордов</span></div></div>`;
  {

  }
  h += `<h2>Упражнение</h2><div class="chips">${Object.keys(EX).map(k => `<button class="chip ${k===S.prog?"on":""}" data-a="prog" data-k="${k}">${EX[k].name}</button>`).join("")}</div>`;
  h += `<div class="stats">

/* ================= ЛИСТ ЗАПИСИ ================= */
function openSheet(k){
  const ds = iso(S.cur), deload = isDeload(S.cur), e = EX[k];
  const cur = S.days[ds] && S.days[ds].ex && S.days[ds].ex[k];
  const last = lastEntry(k, ds), sug = suggest(k, ds, deload);
  const sets = deload ? Math.max(e.sets-1,1) : e.sets;
  let wt = null, r;
  if (e.kind === "w") wt = cur ? cur.wt : (sug ? sug.wt : (last ? last.wt : e.def));
  if (cur) r = cur.r.slice();
  else if (last && !(sug && sug.up)) r = last.r.slice(0, sets);
  else r = Array(sets).fill(e.kind === "t" ? e.lo : e.lo);
  while (r.length < sets) r.push(r[r.length-1] || e.lo);
  S.sheet = {k, wt, r, edit: !!cur};
  renderSheet();
  $("#sheet").classList.add("open");
  try { tg.BackButton.show(); } catch(err){}
}
function renderSheet(){
  const {k, wt, r, edit} = S.sheet, e = EX[k], unit = e.kind === "t" ? "с" : "повт.";
  const last = lastEntry(k, iso(S.cur));
  $("#panel").innerHTML = `<div class="grab"></div>
    <div class="row between"><div><div class="ex-name" style="font-size:19px">${e.name}</div>
    <div class="ex-meta">Цель ${targetText(e, isDeload(S.cur))} · отдых ${e.rest}</div></div>
    <button data-a="close" style="font-size:24px;color:var(--hint);padding:4px 8px">×</button></div>
    <div class="ex-meta" style="margin:8px 0 14px">Прошлый раз: ${entryText(k, last)}</div>
    ${e.kind === "w" ? `<div class="sub" style="margin-bottom:6px">Вес, кг${e.per ? " (одна гантель)" : ""}</div>
      <div class="stepper"><button data-a="wt" data-s="-1">−</button><input id="wtIn" inputmode="decimal" value="${fmt(wt).replace(",", ".")}"><button data-a="wt" data-s="1">+</button></div>
      <div style="height:12px"></div>` : ""}
    <div class="sub">Подходы (${unit}${e.per ? ", " + e.per : ""})</div>
    ${r.map((x, i) => `<div class="set-row"><label>${i+1}-й</label><div class="stepper">
      <button data-a="rep" data-i="${i}" data-s="-1">−</button><input data-rep="${i}" inputmode="numeric" value="${x}"><button data-a="rep" data-i="${i}" data-s="1">+</button></div></div>`).join("")}
    <div class="small-actions"><button data-a="setn" data-s="-1">− подход</button><button data-a="setn" data-s="1">+ подход</button></div>
    <button class="btn" data-a="save">Сохранить</button>
    ${edit ? `<button class="btn ghost" data-a="delentry" style="margin-top:6px">Удалить запись</button>` : ""}
    <details style="margin:12px 0 0;background:var(--bg)"><summary>Техника</summary>${scheme(k)}<p>${e.tech}</p></details>`;
}
function readSheet(){
  const s = S.sheet; if (!s) return;
  const w = $("#wtIn"); if (w){ const v = parseFloat(w.value.replace(",", ".")); if (!isNaN(v)) s.wt = v; }
  document.querySelectorAll("[data-rep]").forEach(inp => { const v = parseInt(inp.value, 10); if (!isNaN(v)) s.r[+inp.dataset.rep] = v; });
}
function closeSheet(){ $("#sheet").classList.remove("open"); S.sheet = null; try { tg.BackButton.hide(); } catch(e){} }

/* ================= СОБЫТИЯ ================= */
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a;
  if (a === "tab"){ S.view = el.dataset.v; haptic("light"); render(); window.scrollTo(0,0); }
  if (a === "day"){ S.cur = addDays(S.cur, +el.dataset.n); S.override = null; haptic("light"); render(); }
  if (a === "override"){ S.override = el.dataset.v; render(); }
  if (a === "open"){ haptic("light"); openSheet(el.dataset.k); }
  if (a === "close") closeSheet();
  if (a === "wt"){ readSheet(); const e = EX[S.sheet.k]; S.sheet.wt = Math.max(0, +(S.sheet.wt + (+el.dataset.s) * (e.step || 1)).toFixed(2)); haptic("light"); renderSheet(); }
  if (a === "rep"){ readSheet(); const i = +el.dataset.i, st = EX[S.sheet.k].kind === "t" ? 5 : 1; S.sheet.r[i] = Math.max(0, S.sheet.r[i] + (+el.dataset.s)*st); haptic("light"); renderSheet(); }
  if (a === "setn"){ readSheet(); const r = S.sheet.r; if (+el.dataset.s > 0 && r.length < 8) r.push(r[r.length-1] || EX[S.sheet.k].lo); if (+el.dataset.s < 0 && r.length > 1) r.pop(); renderSheet(); }
  if (a === "save"){
    readSheet();
    const {k, wt, r} = S.sheet, ds = iso(S.cur), e = EX[k];
    const reps = r.filter(x => x > 0);
    if (!reps.length || (e.kind === "w" && !(wt > 0))){ toast("Проверь вес и повторы"); return; }
    const w = workoutFor(S.cur) || S.override || workoutFor(nextTraining(S.cur));
    S.days[ds] = S.days[ds] || {w, ex:{}}; S.days[ds].ex = S.days[ds].ex || {};
    S.days[ds].ex[k] = e.kind === "w" ? {wt, r:reps} : {r:reps};
    await saveDay(ds); haptic("ok"); closeSheet(); render();
    const left = WORKOUTS[w].filter(x => !S.days[ds].ex[x]).length;
    if (isPR(k, ds)){ confetti(); toast(`🏆 Новый рекорд: ${e.name}, ${entryText(k, S.days[ds].ex[k])}`); }
    else toast(adviceText(k, wt, reps, isDeload(S.cur)) + (left ? "" : " · Всё записано — жми «Завершить»"));
  }
  if (a === "delentry"){
    const ds = iso(S.cur); delete S.days[ds].ex[S.sheet.k]; await saveDay(ds); closeSheet(); render(); toast("Запись удалена");
  }
  if (a === "finish"){
    const ds = iso(S.cur), w = workoutFor(S.cur) || S.override || workoutFor(nextTraining(S.cur));
    S.days[ds] = S.days[ds] || {w, ex:{}}; S.days[ds].done = !S.days[ds].done; await saveDay(ds);
    const m = mondayOf(S.cur);
    if (S.days[ds] && S.days[ds].done){ haptic("ok"); toast(`Тренировка отмечена · на неделе ${sessionsIn(m, addDays(m,6))}/3. Протеин и завтрак с белком!`); }
    render();
  }
  if (a === "prog"){ S.prog = el.dataset.k; render(); }
  if (a === "theme"){ S.cfg.theme = el.dataset.v; applyTheme(); haptic("light"); render(); try { await Store.set("cfg", JSON.stringify(S.cfg)); } catch(e){} }
  if (a === "more"){ S.moreTab = el.dataset.v; render(); }
  if (a === "bstep"){ const inp = $("#" + el.dataset.f); const base = parseFloat((inp.value || (el.dataset.f === "bT" ? "95" : "90")).replace(",", ".")); inp.value = +(base + (+el.dataset.s)).toFixed(1); haptic("light"); }
  if (a === "bsave"){
    const ds = $("#bDate").value || iso(today());
    const w = parseFloat($("#bW").value.replace(",", ".")), t = parseFloat(($("#bT").value || "").replace(",", "."));
    if (!(w > 30 && w < 300)){ toast("Проверь вес"); return; }
    S.body[ds] = {w}; if (t > 40 && t < 200) S.body[ds].t = t;
    await saveBodyMonth(ds.slice(0,7)); S.bodyDate = null; haptic("ok"); render(); toast("Замер сохранён");
  }
  if (a === "bdel"){ const ds = S.bodyDate || iso(today()); delete S.body[ds]; await saveBodyMonth(ds.slice(0,7)); S.bodyDate = null; render(); toast("Замер удалён"); }
  if (a === "export"){
    const txt = JSON.stringify({v:1, days:S.days, body:S.body});
    $("#io").value = txt;
    try { await navigator.clipboard.writeText(txt); toast("Скопировано в буфер"); } catch(e){ $("#io").select(); toast("Выдели и скопируй текст"); }
  }
  if (a === "import"){
    let d; try { d = JSON.parse($("#io").value); } catch(e){ toast("Не похоже на резервную копию"); return; }
    if (!d || !d.days || !d.body){ toast("Не похоже на резервную копию"); return; }
    const ok = await new Promise(res => inTG && tg.showConfirm ? tg.showConfirm("Заменить текущие данные копией?", res) : res(confirm("Заменить текущие данные копией?")));
    if (!ok) return;
    for (const ds of Object.keys(S.days)) await Store.del(dayKey(ds));
    const months = new Set(Object.keys(S.body).map(x => x.slice(0,7)));
    for (const m of months) await Store.del(monthKey(m));
    S.days = d.days; S.body = d.body;
    for (const ds of Object.keys(S.days)) await saveDay(ds);
    for (const m of new Set(Object.keys(S.body).map(x => x.slice(0,7)))) await saveBodyMonth(m);
    toast("Данные восстановлены"); render();
  }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "bDate"){ S.bodyDate = ev.target.value; render(); }
});

/* ================= СТАРТ ================= */
(async function init(){
  if (tg){
    try { tg.ready(); tg.expand(); } catch(e){}
    try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch(e){}
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){}
    try { tg.BackButton.onClick(closeSheet); } catch(e){}
    try { tg.onEvent("themeChanged", render); } catch(e){}
  }
  applyTheme();
  try { await loadAll(); } catch(e){ toast("Не удалось загрузить данные: " + e); }
  applyTheme();
  render();
})();
</script>
